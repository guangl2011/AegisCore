[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscore"
version = "0.1.0"
description = "Cyber-resilient universal edge controller and safety supervisor for heterogeneous commercial outdoor robots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
advisory = [
    # Exact pin per spec locked decision: physicalai is pre-1.0 with weekly
    # releases and in-window breaking deprecations — bump deliberately after
    # a smoke test, never loosely. Integration targets public documented APIs
    # only (docs.openvino.ai/2026/physical-ai).
    "physicalai==0.4.0",
    # Fallback inference runtime for non-Intel / no-OpenVINO hosts.
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
